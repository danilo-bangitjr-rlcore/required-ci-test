name: Post status
on:
  pull_request:
permissions:
  statuses: write
jobs:
  post:
    runs-on: ubuntu-slim
    steps:
      - run: gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" -f state=success -f context=ci -f description="posted by GITHUB_TOKEN"
        env:
          GH_TOKEN: ${{ github.token }}
